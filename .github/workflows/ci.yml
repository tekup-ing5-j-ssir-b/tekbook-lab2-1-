name: Java CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Compile
      run: mvn -B package -DskipTests
    - name: List files
      run: ls -lh target/*.jar

  package-check:
    needs: compile
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check JAR exists
      run: ls -lh target/*.jar
